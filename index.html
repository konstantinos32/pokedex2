<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-red-500 text-white p-4">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-2xl font-bold">Pokédex</h1>

            <div class="space-x-4">
                <a href="index.html" class="hover:underline">Home</a>
                <a href="pokedex.html" class="hover:underline">My Pokédex</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-6">

        <!-- Search -->
        <div class="flex gap-2 mb-6">
            <input
                id="searchInput"
                type="text"
                placeholder="Search Pokémon..."
                class="border p-2 rounded w-full"
            >

            <button
                id="searchBtn"
                class="bg-blue-500 text-white px-4 rounded"
            >
                Search
            </button>
        </div>

        <!-- Pokemon Cards -->
        <div
            id="pokemonContainer"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"
        >

        </div>

    </main>
<dialog id="searchDialog" class="rounded-lg p-6">
        <p id="dialogMessage"></p>

        <button
            id="closeDialog"
            class="bg-blue-500 text-white px-4 py-2 rounded mt-4"
        >
            Close
        </button>
    </dialog>

    <script src="main.js"></script>

</body>
</html>
